name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: [8.*, 9.*, 10.*, 11.*, 12.*, 13.*]
        stability: [prefer-stable]
        include:
          - laravel: 8.*
            testbench: ^6.0
          - laravel: 9.*
            testbench: ^7.0
          - laravel: 10.*
            testbench: ^8.0
          - laravel: 11.*
            testbench: ^9.0
          - laravel: 12.*
            testbench: ^10.0
          - laravel: 13.*
            testbench: ^11.0
        exclude:
          # Laravel 11+ requires PHP 8.2+
          - laravel: 11.*
            php: 8.1
          - laravel: 12.*
            php: 8.1
          # Laravel 13+ requires PHP 8.3+
          - laravel: 13.*
            php: 8.1
          - laravel: 13.*
            php: 8.2
          # Laravel 8 doesn't support PHP 8.4
          - laravel: 8.*
            php: 8.4
          # Laravel 12+ are the supported framework lines compatible with PHP 8.5
          - laravel: 8.*
            php: 8.5
          - laravel: 9.*
            php: 8.5
          - laravel: 10.*
            php: 8.5
          - laravel: 11.*
            php: 8.5

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, zlib
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 600
          # The matrix tests Laravel lines that no longer receive security
          # fixes (8-11), and Composer now refuses to install releases with
          # published advisories. Allow them here: this only selects the
          # framework version under test and does not affect package users.
          # COMPOSER_NO_BLOCKING is current; COMPOSER_NO_SECURITY_BLOCKING is
          # the name Composer 2.9 introduced. Older versions ignore both.
          COMPOSER_NO_BLOCKING: 1
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: |
          # Retry the install pipeline to absorb transient packagist DNS / curl
          # timeouts that occasionally hit GitHub-hosted runners.
          for attempt in 1 2 3; do
            composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update && \
            composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update && \
            composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress && \
            exit 0
            echo "::warning::composer install attempt ${attempt} failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::composer install failed after 3 attempts"
          exit 1

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit --testdox
